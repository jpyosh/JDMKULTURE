<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title>GM Operations Console — JDM Kulture</title>
<link rel="icon" href="jdm-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="themes/telemetry.css">
<link rel="stylesheet" href="themes/editorial.css">
<script>
  // The look (Classic, Telemetry, Editorial; see js/theme.js) is applied before the first paint.
  (function () {
    var root = document.documentElement, theme = root.getAttribute('data-default-theme') || 'classic';
    try { theme = localStorage.getItem('gmops-theme') || theme; } catch (e) { /* storage blocked */ }
    if (['classic', 'telemetry', 'editorial'].indexOf(theme) < 0) theme = 'classic';
    root.setAttribute('data-theme', theme);
  })();
</script>
</head>
<body>

<!-- Shown until the user is signed in and authorised -->
<div id="gate" class="gate">
  <div class="gate-card">
    <div class="brand-lockup"><img src="assets/jdm-kulture-logo.png" onerror="this.onerror=null;this.src='jdm-mark.svg'" alt="JDM Kulture">
      <div class="wordmark"><div class="name">JDM KULTURE</div><div class="sub">GM Operations Console</div></div></div>
    <form id="login-form" class="login-form" hidden>
      <label for="login-email">Email</label>
      <input type="email" id="login-email" autocomplete="email" required>
      <label for="login-password">Password</label>
      <input type="password" id="login-password" autocomplete="current-password" required>
      <button class="btn" type="submit">Sign in</button>
    </form>
    <div id="gate-message" class="gate-message" role="alert"></div>
    <button class="btn ghost" id="gate-signout" type="button" hidden>Sign out</button>
  </div>
</div>

<div class="app" id="app" hidden>
  <nav class="rail">
    <div class="wordmark">
      <div class="brand-lockup"><img src="assets/jdm-kulture-logo.png" onerror="this.onerror=null;this.src='jdm-mark.svg'" alt="JDM Kulture">
        <div><div class="name">JDM KULTURE</div><div class="sub">GM Operations Console</div></div></div>
      <div class="shop-clock" data-clock title="Shop time (Philippines)"></div>
    </div>
    <div class="auth-panel">
      <div class="auth-status"><span class="status-dot online"></span><span id="user-role"></span></div>
      <div class="auth-email" id="user-email"></div>
      <div class="theme-switch">
        <span class="theme-label">Theme <b data-theme-name>Classic</b></span>
        <div class="theme-options" role="radiogroup" aria-label="Theme">
          <button type="button" role="radio" aria-checked="true" aria-label="Classic" title="Classic" data-theme-choice="classic"><span class="swatch" aria-hidden="true"></span></button>
          <button type="button" role="radio" aria-checked="false" aria-label="Telemetry" title="Telemetry" data-theme-choice="telemetry" tabindex="-1"><span class="swatch" aria-hidden="true"></span></button>
          <button type="button" role="radio" aria-checked="false" aria-label="Editorial" title="Editorial" data-theme-choice="editorial" tabindex="-1"><span class="swatch" aria-hidden="true"></span></button>
        </div>
      </div>
      <button class="btn ghost auth-signout" id="signout-btn" type="button">Sign out</button>
    </div>
    <div class="nav" id="nav" aria-label="Main navigation"></div>
  </nav>

  <main class="main">
    <section id="view-carwash" class="view"></section>
    <section id="view-detailing" class="view"></section>
    <section id="view-tint_ppf" class="view"></section>
    <section id="view-parts" class="view"></section>
    <section id="view-inventory" class="view"></section>
    <section id="view-eod" class="view"></section>
    <section id="view-pricing" class="view"></section>
    <section id="view-reports" class="view"></section>
    <section id="view-finance" class="view"></section>
    <section id="view-cash_fund" class="view"></section>
    <section id="view-payroll" class="view"></section>
    <section id="view-settings" class="view"></section>
  </main>
</div>

<div id="app-toast" class="app-toast" role="status" aria-live="polite"></div>
<dialog id="modal" class="modal"><div class="modal-card" id="modal-card"></div></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
